{% extends 'layout.html' %}

{% block content %}

<h2>{{action}} Pertanyaan</h2>

<form method="post">

    <div class="mb-3">

        <label>ID</label>

        <input class="form-control" name="id" value="{{data.ID if data}}" {% if action=="Edit" %}readonly{% endif %}>

    </div>

    <div class="mb-3">

        <label>Pertanyaan</label>

        <textarea class="form-control" rows="4" name="question">{{data.Question if data}}</textarea>

    </div>

    <div class="mb-3">

        <label>Ground Truth SQL</label>

        <textarea class="form-control" rows="8" name="sql">{{data.SQL if data}}</textarea>

    </div>

    <div class="mb-3">

        <label>Level</label>

        <select class="form-select" name="level">

            <option>Easy</option>

            <option>Medium</option>

            <option>Hard</option>

        </select>

    </div>

    <button class="btn btn-success">

        Simpan

    </button>

</form>

{% endblock %}
