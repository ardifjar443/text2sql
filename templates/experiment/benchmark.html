<div class="card">

    <div class="card-header">

        Benchmark

    </div>

    <div class="card-body">

        <label>

            Retrieval Strategy

        </label>

        <div>

            {% for r in retrievals %}

            <div class="form-check">

                <input class="form-check-input" type="checkbox" value="{{r}}">

                <label>

                    {{r}}

                </label>

            </div>

            {% endfor %}

        </div>

        <hr>

        <button class="btn btn-primary">

            Run Benchmark

        </button>

    </div>

</div>
