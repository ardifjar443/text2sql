<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Text2SQL Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>
    {% include 'partials/navbar.html' %}

    <div class="container-fluid">
        <!-- Hapus flex-nowrap agar layout lebih stabil -->
        <div class="row">

            {% include 'partials/sidebar.html' %}

            <!-- Class diubah menjadi 'col' agar otomatis mengisi sisa layar -->
            <main class="col px-4 mt-3">

                <!-- Tombol Toggle -->
                <button class="btn btn-outline-primary mb-3" id="sidebarToggleBtn">
                    <i class="bi bi-list"></i>
                </button>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="mt-3">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <!-- Konten Utama Anda -->
                {% block content %}
                {% endblock %}

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Toggle -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.getElementById('sidebar');

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    // Menyembunyikan sidebar dengan class d-none
                    sidebar.classList.toggle('d-none');
                });
            }
        });
    </script>
</body>

</html>
